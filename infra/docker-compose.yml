# Radyo Klasik self-hosted radio stack — Phase 0 scaffolding.
# Run from this directory (infra/):  docker compose up --build
# Requires an infra/.env (see .env.example).
name: radyoklasik

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radyo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-radyoklasik}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published for host-run integration tests (jest) and local psql. The DSN
    # the API/Liquidsoap use stays the in-network `postgres` host.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radyo} -d ${POSTGRES_DB:-radyoklasik}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [radyonet]

  icecast:
    image: libretime/icecast:2.4.4
    restart: unless-stopped
    environment:
      ICECAST_HOSTNAME: ${ICECAST_HOSTNAME:-localhost}
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?set ICECAST_SOURCE_PASSWORD in infra/.env}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?set ICECAST_ADMIN_PASSWORD in infra/.env}
    # Render env secrets into a writable copy (the mounted config is read-only,
    # so the repo file is never modified / never leaks secrets), then run.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed \
          -e "s|@ICECAST_HOSTNAME@|$${ICECAST_HOSTNAME}|g" \
          -e "s|@ICECAST_SOURCE_PASSWORD@|$${ICECAST_SOURCE_PASSWORD}|g" \
          -e "s|@ICECAST_ADMIN_PASSWORD@|$${ICECAST_ADMIN_PASSWORD}|g" \
          /etc/icecast/icecast.xml > /tmp/icecast.xml
        exec icecast -c /tmp/icecast.xml
    volumes:
      - ./icecast/icecast.xml:/etc/icecast/icecast.xml:ro
    ports:
      - "8000:8000"
    networks: [radyonet]

  # One-shot: named volumes start root-owned, but Liquidsoap runs as uid 10000
  # and must write HLS segments.
  volume-init:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /var/hls/.tmp && chown -R 10000:10001 /var/hls"]
    volumes:
      - hls:/var/hls
    restart: "no"

  liquidsoap:
    image: savonet/liquidsoap:v2.2.5
    restart: unless-stopped
    depends_on:
      icecast:
        condition: service_started
      volume-init:
        condition: service_completed_successfully
    environment:
      ICECAST_HOST: ${ICECAST_HOST:-icecast}
      ICECAST_PORT: ${ICECAST_PORT:-8000}
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?set ICECAST_SOURCE_PASSWORD in infra/.env}
      # Phase 2: DB-driven rotation + metadata hook talk to the API.
      API_BASE: ${API_BASE:-http://api:8001}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?set INTERNAL_API_SECRET in infra/.env}
      CROSSFADE_DURATION: ${CROSSFADE_DURATION:-3.0}
      # Phase 4: live DJ harbor (input.harbor /live). Port stays on radyonet
      # (NOT published to the host); the api container reaches it for ffmpeg.
      LIVE_HARBOR_PORT: ${LIVE_HARBOR_PORT:-8005}
      LIVE_HARBOR_USER: ${LIVE_HARBOR_USER:-source}
      LIVE_HARBOR_PASSWORD: ${LIVE_HARBOR_PASSWORD:?set LIVE_HARBOR_PASSWORD in infra/.env}
      LIVE_HARBOR_TIMEOUT: ${LIVE_HARBOR_TIMEOUT:-10.0}
      # Phase A: harbor prebuffer = dominant mic-to-air latency knob (seconds).
      LIVE_HARBOR_BUFFER: ${LIVE_HARBOR_BUFFER:-0.5}
      LIVE_DUCK_LEVEL: ${LIVE_DUCK_LEVEL:-0.25}
      LIVE_FADE_DURATION: ${LIVE_FADE_DURATION:-0.8}
      # Bundled clips used only for the emergency dead-air fallback.
      EMERGENCY_MEDIA_DIR: /srv/test-media
      TEST_MEDIA_DIR: /srv/test-media
    # The harbor port is reachable on the private radyonet only.
    expose:
      - "${LIVE_HARBOR_PORT:-8005}"
    entrypoint: ["liquidsoap"]
    command: ["/etc/liquidsoap/radio.liq"]
    volumes:
      - ./liquidsoap/radio.liq:/etc/liquidsoap/radio.liq:ro
      - ./liquidsoap/test-media:/srv/test-media:ro
      # Phase 2: read access to uploaded tracks selected by /api/v1/playout/next.
      - media:/var/media:ro
      # Phase 9: HLS segments + playlists, served by Caddy at /hls/.
      - hls:/var/hls
    networks: [radyonet]

  api:
    build:
      context: ../RadyoKlasikServer
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      icecast:
        condition: service_started
      liquidsoap:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8001}
      DATABASE_URL: ${DATABASE_URL}
      ICECAST_HOST: ${ICECAST_HOST:-icecast}
      ICECAST_PORT: ${ICECAST_PORT:-8000}
      LIQUIDSOAP_HOST: ${LIQUIDSOAP_HOST:-liquidsoap}
      LIQUIDSOAP_TELNET_PORT: ${LIQUIDSOAP_TELNET_PORT:-1234}
      MEDIA_DIR: ${MEDIA_DIR:-/var/media}
      APP_DATA_DIR: /var/radyo-data
      # Phase 2: internal secret for the Liquidsoap <-> API playout endpoints,
      # and seeding a starter rotation from the bundled clips on first boot.
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?set INTERNAL_API_SECRET in infra/.env}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_MEDIA_DIR: ${SEED_MEDIA_DIR:-/srv/test-media}
      # Phase 4: where the live mic ingest (ws/ingest.js -> ffmpeg) publishes to
      # the Liquidsoap harbor, plus the auto-failback window + duck defaults.
      LIVE_HARBOR_PORT: ${LIVE_HARBOR_PORT:-8005}
      LIVE_HARBOR_USER: ${LIVE_HARBOR_USER:-source}
      LIVE_HARBOR_PASSWORD: ${LIVE_HARBOR_PASSWORD:?set LIVE_HARBOR_PASSWORD in infra/.env}
      LIVE_HARBOR_MOUNT: ${LIVE_HARBOR_MOUNT:-live}
      LIVE_FALLBACK_TIMEOUT_MS: ${LIVE_FALLBACK_TIMEOUT_MS:-8000}
      LIVE_DUCK_LEVEL: ${LIVE_DUCK_LEVEL:-0.25}
      LIVE_SILENCE_THRESHOLD: ${LIVE_SILENCE_THRESHOLD:-0.05}
      # Phase 6 listener analytics.
      STREAM_PROXY_IP: 172.28.0.10
      CADDY_STREAM_LOG: /var/log/caddy/stream-access.log
    volumes:
      - media:/var/media
      # Phase 6: Caddy's stream access log (proxied listener sessions).
      - caddylogs:/var/log/caddy:ro
      # Phase 9: HLS output, read-only, for the freshness alert.
      - hls:/var/hls:ro
      # Recordings, recording thumbnails, chat history, announcement — must
      # survive image rebuilds (they used to live inside the container).
      - appdata:/var/radyo-data
      # Bundled clips used to seed a starter rotation into the library.
      - ./liquidsoap/test-media:/srv/test-media:ro
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [radyonet]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - icecast
    environment:
      STREAM_DOMAIN: ${STREAM_DOMAIN:-stream.radyoklasik.online}
      API_DOMAIN: ${API_DOMAIN:-api.radyoklasik.online}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@radyoklasik.online}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Phase 6: stream access log (real listener IPs) read by the API.
      - caddylogs:/var/log/caddy
      # Phase 9: HLS output written by Liquidsoap.
      - hls:/srv/hls:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      radyonet:
        # Must match STREAM_PROXY_IP for the API (listener analytics).
        ipv4_address: 172.28.0.10

  # Phase 9: scheduled backups (daily DB dump, weekly media archive, optional
  # offsite copy via rclone). Files land in infra/backups/ on the host.
  # Run one now:  docker compose run --rm backup /backup/backup.sh once
  # Restore:      ./backup/restore.sh db|media <file>   (see OPERATIONS.md)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radyo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-radyoklasik}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_MEDIA: ${BACKUP_KEEP_MEDIA:-4}
      BACKUP_MEDIA_WEEKDAY: ${BACKUP_MEDIA_WEEKDAY:-1}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
    entrypoint: ["/bin/sh"]
    command: ["/backup/backup.sh"]
    volumes:
      - ./backup:/backup:ro
      - ./backups:/backups
      - ./backup/rclone:/config/rclone:ro
      - media:/var/media:ro
      - appdata:/var/radyo-data:ro
    networks: [radyonet]

  # Optional S3-compatible object storage for media (Phase 1+).
  # Enable with:  docker compose --profile minio up
  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-radyo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/.env}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks: [radyonet]

networks:
  radyonet:
    driver: bridge
    # Fixed subnet so Caddy has a stable address. Icecast 2.4 can't honour
    # X-Forwarded-For, so every proxied listener appears as Caddy's IP; the API
    # uses this address to skip those in the Icecast poller and takes proxied
    # sessions (with real IPs) from Caddy's access log instead (Phase 6).
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  appdata:
  hls:
  caddylogs:
  pgdata:
  media:
  caddy_data:
  caddy_config:
  minio_data:
