# Radyo Klasik CI (Phase 9): backend tests against Postgres, studio unit tests
# + production build, Liquidsoap script type-check, compose validation.
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: radyo
          POSTGRES_PASSWORD: dev-postgres-pw
          POSTGRES_DB: radyoklasik
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radyo" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: RadyoKlasikServer
    env:
      NODE_ENV: test
      SECRET_KEY: test-secret
      TEST_DATABASE_URL: postgres://radyo:dev-postgres-pw@localhost:5432/radyoklasik_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: RadyoKlasikServer/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # MinIO stands in for Cloudflare R2 (recordings storage tests).
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=rktest -e MINIO_ROOT_PASSWORD=rktest-secret-123 \
            minio/minio server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9100/minio/health/live && break; sleep 1; done
      - run: npm ci
      - run: npx jest --runInBand

  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radyo-klasik-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: radyo-klasik-studio/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx next lint
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Liquidsoap script type-check
        run: >-
          docker run --rm -v "$PWD/infra/liquidsoap:/etc/liquidsoap:ro"
          -e HLS_ENABLED=false --entrypoint liquidsoap savonet/liquidsoap:v2.2.5
          --check /etc/liquidsoap/radio.liq
      - name: Compose files are valid (dev + prod)
        working-directory: infra
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
